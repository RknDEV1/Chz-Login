name: Build ChzLogin XCFramework

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare private secrets header
        env:
          CHZ_SECRETS_HEADER: ${{ secrets.CHZ_SECRETS_HEADER }}
        run: |
          set -euo pipefail
          if [ -z "${CHZ_SECRETS_HEADER:-}" ]; then
            echo "Configure the CHZ_SECRETS_HEADER repository secret before running this workflow." >&2
            exit 2
          fi
          printf '%s\n' "$CHZ_SECRETS_HEADER" > ChzAuth/Sources/CHZSecrets.h

      - name: Select optional Xcode beta
        env:
          XCODE_PATH: ${{ vars.XCODE_PATH }}
        run: |
          set -euo pipefail
          if [ -n "${XCODE_PATH:-}" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build iOS 16 arm64 framework
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
          SDK_NAME: iphoneos
        run: |
          set -euo pipefail
          chmod +x Scripts/build_chzlogin_xcframework.sh
          Scripts/build_chzlogin_xcframework.sh

      - name: Verify minimum OS and architecture
        run: |
          set -euo pipefail
          FRAMEWORK=build/ChzLogin.xcframework/ios-arm64/ChzLogin.framework/ChzLogin
          file "$FRAMEWORK"
          otool -l "$FRAMEWORK" | grep -A4 LC_BUILD_VERSION
          otool -L "$FRAMEWORK"
          grep -F 'IPHONEOS_DEPLOYMENT_TARGET=16.0' build/ChzLogin.xcframework/BuildInfo.txt

      - name: Create artifact archive
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent build/ChzLogin.xcframework ChzLogin.xcframework.zip

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: ChzLogin-xcframework-ios16
          path: ChzLogin.xcframework.zip
          if-no-files-found: error
