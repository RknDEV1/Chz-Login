name: Build CHZ Login dylib

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SDK: iphoneos
  ARCH: arm64
  API_REPO: baontq23/Logos-API-Authentication
  API_REF: d7161ccd290cd179c3c77ffe6394afed3e8cdba5

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Verificar arquivos fonte
        shell: bash
        run: |
          set -euo pipefail
          test -f Vendor/API/APIClient.h
          test -f Sources/CHZAuthManager.m
          test -f Sources/CHZKeychain.m
          test -f Sources/CHZLoginViewController.m
          test -f Sources/CHZLoginBootstrap.m

      - name: Baixar biblioteca Lite Secure compatível
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Vendor/API
          curl --fail --location --retry 3 \
            "https://github.com/${API_REPO}/raw/${API_REF}/API%20%28Lite%20Secure%29/libAPIClient.a" \
            --output Vendor/API/libAPIClient.a
          test -s Vendor/API/libAPIClient.a

      - name: Preparar configuração privada
        env:
          CHZ_API_TOKEN: ${{ secrets.CHZ_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CHZ_API_TOKEN"
          mkdir -p build/include
          python3 - <<'PY'
          import os
          from pathlib import Path
          token = "".join(os.environ["CHZ_API_TOKEN"].split())
          if not token:
              raise SystemExit("CHZ_API_TOKEN vazio")
          escaped = token.replace("\\", "\\\\").replace('"', '\\"')
          newline = chr(10)
          content = (
              '#import <Foundation/Foundation.h>' + newline
              + f'#define CHZ_API_TOKEN @"{escaped}"' + newline
          )
          Path("build/include/CHZSecrets.h").write_text(content, encoding="utf-8")
          PY
          cp Vendor/API/APIClient.h build/include/APIClient.h

      - name: Compilar fontes Objective-C arm64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/obj
          for source in \
            Sources/CHZAuthManager.m \
            Sources/CHZKeychain.m \
            Sources/CHZLoginViewController.m \
            Sources/CHZLoginBootstrap.m; do
            object="build/obj/$(basename "${source%.m}").o"
            xcrun --sdk "$SDK" clang \
              -arch "$ARCH" \
              -isysroot "$(xcrun --sdk "$SDK" --show-sdk-path)" \
              -fobjc-arc \
              -fblocks \
              -fmodules \
              -Ibuild/include \
              -IVendor/API \
              -c "$source" \
              -o "$object"
          done

      - name: Compilar dylib arm64
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk "$SDK" clang++ \
            -arch "$ARCH" \
            -isysroot "$(xcrun --sdk "$SDK" --show-sdk-path)" \
            -dynamiclib \
            -fobjc-arc \
            -fblocks \
            -ObjC \
            -Wl,-dead_strip \
            -Wl,-x \
            -Wl,-S \
            -Wl,-install_name,@executable_path/CHZLogin.dylib \
            build/obj/CHZAuthManager.o \
            build/obj/CHZKeychain.o \
            build/obj/CHZLoginViewController.o \
            build/obj/CHZLoginBootstrap.o \
            Vendor/API/libAPIClient.a \
            -framework Foundation \
            -framework UIKit \
            -framework Security \
            -lc++ \
            -o build/CHZLogin.dylib
          test -f build/CHZLogin.dylib
          xcrun --sdk "$SDK" file build/CHZLogin.dylib || true

      - name: Publicar dylib como asset de Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CHZLogin build ${GITHUB_RUN_NUMBER}" \
            --notes "Build gerado a partir do commit ${GITHUB_SHA}." \
            build/CHZLogin.dylib
