name: Check CHZ PRIV

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Conferir arquivos do projeto
        run: |
          test -f "Config/CHZSecrets.example.h"
          test -f "Sources/CHZAuthManager.m"
          test -f "Sources/CHZKeychain.m"
          test -f "Sources/CHZLoginViewController.m"
          test -f "Vendor/LiteSecure/APIClient.h"
          test -f "Vendor/LiteSecure/libAPIClient.a"
          echo "Estrutura conferida."
