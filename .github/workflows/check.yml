name: Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Conferir arquivos do projeto
        shell: bash
        run: |
          set -euo pipefail
          test -f "Config/CHZSecrets.example.h"
          test -f "Sources/CHZAuthManager.m"
          test -f "Sources/CHZKeychain.m"
          test -f "Sources/CHZLoginViewController.m"
          test -f "Sources/CHZLoginBootstrap.m"
          test -f "Vendor/API/APIClient.h"
          test -f "Vendor/API/libAPIClient.a"
          grep -q "__attribute__((constructor))" "Sources/CHZLoginBootstrap.m"
          grep -q "CHZTryPresentLogin" "Sources/CHZLoginBootstrap.m"
          echo "Estrutura e bootstrap conferidos."
